<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<title>Admin – MH Video Delivery</title>
</head>
<body>
<main class="wrap">
  <h1>MH Admin</h1>

  <!-- LOGIN -->
  <form id="login" class="card">
    <h2>Admin login</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <p id="loginErr" class="error"></p>
    <button type="submit" id="signin">Sign in</button>
  </form>

  <!-- DASHBOARD -->
  <div id="app" hidden>
    <button type="button" id="signout" class="btn sm">Sign out</button>

    <form id="up" class="card">
      <h2>Upload video</h2>
      <input id="name" placeholder="Video name" maxlength="120" required>
      <input id="file" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-matroska" required>
      <div class="prog" hidden><div id="bar"></div></div>
      <button type="submit" id="send">Upload</button>
      <p id="result" hidden>Token: <code id="tokenOut"></code>
        <button type="button" id="copy" class="btn sm">Copy token</button></p>
    </form>

    <div class="card">
      <h2>Videos</h2>
      <input id="q" placeholder="Search by token or name">
      <div class="tw">
        <table>
          <thead><tr><th>Name</th><th>Token</th><th>Date</th><th>Drive ID</th><th>Status</th><th></th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
